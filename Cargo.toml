[package]
name = "phala_phat_contract"
version = "0.1.0"
edition = "2021"

[dependencies]
pink = { version = "0.1", default-features = false, features = ["std"] }
phat_offchain_rollup = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
log = "0.4"
hex = { version = "0.4", default-features = false, features = ["std"] }
sp-core = { version = "27", default-features = false, features = ["std"] }

[lib]
name = "phala_phat_contract"
path = "src/lib.rs"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
